<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip de Coin Project</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <h1 class="title">Flip de Coin</h1>
      <p class="description">Click the coin or button to flip the coin!</p>

      <img
        class="coin-img"
        id="coin"
        src="./assets/coin-head.png"
        alt="Coin Image"
      />
      <p class="result" id="result">heads</p>

      <!--- Este boton va a triggear el evento de flip de coin -->
      <button class="flip-button" id="flip-button" onclick="flipCoin()">Flip Coin</button>

    </main>
  </body>
</html>
